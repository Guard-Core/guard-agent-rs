name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (all features, including Redis persistence)
        run: cargo test --all-features -- --include-ignored

  coverage:
    name: coverage (100% lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          cache-shared-key: ci-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov

      # The gate computes line coverage from the lcov export's per-line DA
      # records, not from llvm-cov's summary: the summary aggregation
      # falsely claims misses its own lcov view refutes (the artifact
      # root-caused and documented in guard-core-rs's coverage gate; the
      # same toolchain pair trips it here once the bridge feature's data
      # joins the profile). Fail-closed 100%-lines semantics; the summary
      # stays as an informational printout.
      - name: Generate the line-coverage export
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --include-ignored

      - name: Enforce 100% line coverage from the export's per-line records
        run: python3 .github/scripts/enforce_line_coverage.py lcov.info

      # `report` takes no feature flags: it reads the profdata the run
      # above already produced.
      - name: Print the informational llvm-cov summary
        run: cargo llvm-cov report

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          rustflags: ""
          cache-shared-key: ci-msrv

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Test
        run: cargo test --all-features

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        run: cargo deny check

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-rs (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-rs
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-rs at the path dependency location
        run: mv core-checkout ../guard-core-rs

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          cache-shared-key: ci-ubuntu

      - name: cargo doc
        run: cargo doc --no-deps --all-features
